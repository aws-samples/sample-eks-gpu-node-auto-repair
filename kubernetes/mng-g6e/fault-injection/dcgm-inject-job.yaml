# ${TARGET_NODE} and ${XID} are substituted by inject-fault.sh.
# Simulates a well-known GPU XID so the node monitoring agent sets
# AcceleratedHardwareReady=False and node auto repair applies the configured override.
#
# IMPORTANT (MNG vs Auto Mode): the agent connects to the node's nv-hostengine on localhost.
# dcgmi --inject must talk to that SAME hostengine, so we run the HOST's dcgmi (chrooted into
# the host root so its shared libraries resolve) with hostNetwork, rather than a separate dcgmi
# from a DCGM container image (which would start its own hostengine the agent never reads).
# This mirrors the agent's own e2e injection pattern (aws/eks-node-monitoring-agent).
apiVersion: batch/v1
kind: Job
metadata:
  name: dcgm-inject
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeName: ${TARGET_NODE}
      hostPID: true
      hostIPC: true
      hostNetwork: true
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: host-root
          hostPath:
            path: /
      containers:
        - name: dcgm-inject
          image: public.ecr.aws/amazonlinux/amazonlinux:2023-minimal
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-root
              mountPath: /host
          command: ["bash", "-c"]
          args:
            - |
              set -x
              # Field 230 = DCGM_FI_DEV_XID_ERRORS. Value is the injected XID (e.g. 79 = "GPU
              # has fallen off the bus"). chroot into the host so the host's dcgmi + its CUDA/DCGM
              # shared libraries resolve, and connect to the agent's nv-hostengine on localhost.
              chroot /host /usr/bin/dcgmi test --inject --gpuid 0 -f 230 -v ${XID}
              echo "Injected XID ${XID}; sleeping to keep the value resident."
              sleep 300
