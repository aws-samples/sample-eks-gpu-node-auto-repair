# ${TARGET_NODE} and ${XID} are substituted by inject-fault.sh (and reused by demo.sh).
# Runs dcgmi test --inject against the node's GPU to simulate a well-known XID.
# On EKS Auto Mode the node monitoring agent detects the injected XID and sets
# AcceleratedHardwareReady=False (Fatal) within seconds, triggering node auto repair.
apiVersion: batch/v1
kind: Job
metadata:
  name: dcgm-inject
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeName: ${TARGET_NODE}
      hostPID: true
      hostIPC: true
      hostNetwork: true
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: dcgm
          image: nvcr.io/nvidia/cloud-native/dcgm:3.3.9-1-ubuntu22.04
          securityContext:
            privileged: true
          command: ["bash", "-c"]
          args:
            - |
              set -x
              # Field 230 = DCGM_FI_DEV_XID_ERRORS. Value 79 = "GPU has fallen off the bus"
              # (a well-known Fatal XID the agent classifies as AcceleratedHardwareReady=False).
              dcgmi test --inject --gpuid 0 -f 230 -v ${XID}
              echo "Injected XID ${XID}; sleeping to keep the value resident."
              sleep 600
