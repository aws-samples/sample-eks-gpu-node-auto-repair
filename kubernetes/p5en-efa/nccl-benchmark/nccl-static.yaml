# Hardened NCCL all-reduce over EFA using the SAME torchrun/JobSet rendezvous as the FSDP job
# (no MPI operator, no SSH). Two worker pods (one per node, 8 GPU + 16 EFA each) form a 16-rank
# NCCL group and rank 0 prints busbw GB/s. ${IMAGE} + ${EFA_COUNT} substituted by nccl-test.sh.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: nccl-bench
spec:
  failurePolicy:
    # Allow a few restarts: the torchrun rendezvous can miss on the first attempt if the
    # headless-service DNS for rank-0 hasn't propagated to rank-1 yet (gai error -2). A
    # restart lets the endpoints settle and the group form.
    maxRestarts: 3
  network:
    enableDNSHostnames: true
    subdomain: nccl-bench
  replicatedJobs:
    - name: workers
      replicas: 1
      template:
        spec:
          parallelism: 2
          completions: 2
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              nodeSelector:
                karpenter.sh/nodepool: efa-gpu
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchExpressions:
                          - key: jobset.sigs.k8s.io/jobset-name
                            operator: In
                            values: ["nccl-bench"]
                      topologyKey: kubernetes.io/hostname
              tolerations:
                - key: nvidia.com/gpu
                  operator: Exists
                  effect: NoSchedule
              containers:
                - name: nccl
                  image: ${IMAGE}
                  env:
                    - name: MASTER_ADDR
                      value: "nccl-bench-workers-0-0.nccl-bench"
                    - name: MASTER_PORT
                      value: "29500"
                    - name: NNODES
                      value: "2"
                    - name: NODE_RANK
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
                    - name: FI_PROVIDER
                      value: "efa"
                    - name: NCCL_DEBUG
                      value: "INFO"
                    # Force NCCL bootstrap onto the pod's routable primary interface (eth0),
                    # not loopback — otherwise cross-node rank connect fails (Connect to 127.0.0.1).
                    - name: NCCL_SOCKET_IFNAME
                      value: "eth0"
                    - name: PYTHONUNBUFFERED
                      value: "1"
                  args:
                    - "--nnodes=$(NNODES)"
                    - "--nproc_per_node=8"
                    - "--node_rank=$(NODE_RANK)"
                    - "--master_addr=$(MASTER_ADDR)"
                    - "--master_port=$(MASTER_PORT)"
                    - "--rdzv_id=nccl-bench"
                    - "/workspace/nccl_allreduce.py"
                  resources:
                    limits:
                      nvidia.com/gpu: "8"
                      vpc.amazonaws.com/efa: "${EFA_COUNT}"
                      memory: "64000Mi"
                  volumeMounts:
                    - name: shmem
                      mountPath: /dev/shm
              volumes:
                - name: shmem
                  emptyDir:
                    medium: Memory
                    sizeLimit: 16Gi
